<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crash Curse</title>
<meta name="description" content="Crash Curse: place cards on a shrinking grid, complete the goals on the walls, survive the curses.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">CRASH CURSE <span class="tag">playtest build</span></div>
    <div class="topstats">
      <div class="tstat"><span class="lbl">Score</span><b id="top-score">0</b></div>
      <div class="tstat"><span class="lbl">Best</span><b id="top-best">0</b></div>
    </div>
    <div class="topbtns">
      <button id="btn-new" title="N">New game</button>
      <button id="btn-pause" title="P">Pause</button>
      <button id="btn-bot" title="B">Bot: off</button>
      <button id="btn-hints" title="H">Hints: off</button>
      <button id="btn-help">Rules</button>
      <button id="btn-settings" class="primary">Settings</button>
    </div>
  </header>

  <main class="layout">
    <section class="arena-wrap">
      <div class="arena" id="arena">
        <div class="grid" id="grid"></div>
        <div class="fx" id="fx"></div>
        <div class="wall wall-top" id="wall-top"><div class="goal" data-side="top"></div></div>
        <div class="wall wall-bottom" id="wall-bottom"><div class="goal" data-side="bottom"></div></div>
        <div class="wall wall-left" id="wall-left"><div class="goal" data-side="left"></div></div>
        <div class="wall wall-right" id="wall-right"><div class="goal" data-side="right"></div></div>
        <div class="pops" id="pops"></div>
      </div>
    </section>

    <aside class="hud">
      <div class="hand">
        <div class="hand-current">
          <div class="lbl">Drawn card</div>
          <div id="current" class="current"></div>
          <div id="placement-timer" class="mini-bar" hidden><div class="fill"></div></div>
        </div>
        <div class="hand-next">
          <div class="lbl">Next</div>
          <div id="upcoming" class="upcoming"></div>
          <div class="hint-text" id="hint-text"></div>
        </div>
      </div>
      <div class="stats" id="stats"></div>
      <div class="log-wrap"><div class="lbl">Log</div><ul id="log" class="log"></ul></div>
    </aside>
  </main>

  <div class="modal" id="modal-overlay" hidden><div class="modal-box small" id="overlay-box"></div></div>

  <div class="modal" id="modal-settings" hidden>
    <div class="modal-box" id="settings-box">
      <div class="modal-head">
        <h2>Settings</h2>
        <button id="settings-close" title="Close">✕</button>
      </div>
      <div class="modal-body" id="settings-body"></div>
      <div class="modal-foot">
        <button id="settings-reset">Reset to defaults</button>
        <span class="spacer"></span>
        <button id="settings-cancel">Cancel</button>
        <button id="settings-apply" class="primary">Apply &amp; new game</button>
      </div>
    </div>
  </div>

  <div class="modal" id="modal-help" hidden>
    <div class="modal-box">
      <div class="modal-head"><h2>How to play</h2><button id="help-close" title="Close">✕</button></div>
      <div class="modal-body" id="help-body"></div>
    </div>
  </div>

  <div id="toasts"></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
